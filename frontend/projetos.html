<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>NeuraField — Projetos</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/imgs/nflogo.png">
</head>
<body>

<!-- Layout principal -->
<div class="layout">

  <!-- Barra lateral -->
  <aside class="sidebar">

    <!-- Marca -->
    <div class="sidebar-brand">
      <img src="assets/imgs/nflogo.png" alt="NeuraField" class="brand-icon">
      <div class="brand-name">Neura<span>Field</span></div>
      <div class="brand-tag">Inovação & Tecnologia</div>
    </div>

    <!-- Busca -->
    <div class="sidebar-search">
      <span class="search-icon">⌕</span>
      <input type="text" placeholder="Pesquisar...">
    </div>

    <!-- Navegação -->
    <div class="nav-label">Navegação</div>

    <nav>
      <ul class="menu">

        <li>
          <a href="index.html">
            <button class="btn-sound nav-btn">
              <span class="nav-icon">⌂</span> Home
            </button>
          </a>
        </li>

        <li>
          <a href="neurahub.html">
            <button class="btn-sound nav-btn">
              <span class="nav-icon">◈</span> NeuraHub
            </button>
          </a>
        </li>

        <li>
          <a href="neuralab.html">
            <button class="btn-sound nav-btn">
              <span class="nav-icon">⚗</span> NeuraLab
            </button>
          </a>
        </li>

        <li>
          <a href="neurashop.html">
            <button class="btn-sound nav-btn">
              <span class="nav-icon">◻</span> NeuraShop
            </button>
          </a>
        </li>

        <li>
          <a href="projetos.html">
            <button class="btn-sound nav-btn active">
              <span class="nav-icon">◧</span> Projetos
            </button>
          </a>
        </li>

        <li>
          <a href="parcerias.html">
            <button class="btn-sound nav-btn">
              <span class="nav-icon">⬡</span> Parcerias
            </button>
          </a>
        </li>

      </ul>
    </nav>

    <!-- Rodapé -->
    <div class="sidebar-footer">
      <div class="status-badge">
        <div class="status-dot"></div>
        Sistemas operacionais
      </div>
    </div>

  </aside>

  <!-- Conteúdo principal -->
  <main class="main-content">

    <!-- Topbar -->
    <div class="topbar">

      <span class="tag tag-warn">
        Em Progresso
      </span>

      <!-- Auth -->
      <div id="authArea" class="btn-sound" style="display:flex;align-items:center;gap:10px;position:relative;"></div>

    </div>

    <!-- Cabeçalho -->
    <div class="page-header">

      <div class="header-left">

        <div class="page-eyebrow">
          Projetos · Iniciativas
        </div>

        <h1 class="page-title">
          Nossos <span>Projetos</span>
        </h1>

        <p class="page-subtitle">
          Iniciativas e projetos que moldam a visão de futuro.
        </p>

      </div>

      <div class="header-right">

        <button class="btn-sound btn btn-ghost" data-protected>
          📋 Filtrar
        </button>

        <button class="btn-sound btn btn-primary" data-protected>
          ◧ Novo Projeto
        </button>

      </div>

    </div>

    <!-- Conteúdo -->
    <section class="content-box">

      <div class="empty-state">

        <div class="empty-icon">◧</div>

        <div class="empty-title">
          Projetos em Cadastramento
        </div>

        <div class="empty-desc">
          Este módulo está sendo desenvolvido. Em breve estará disponível.
        </div>

        <button class="btn-sound btn btn-primary" style="margin-top:8px" data-protected>
          ⚡ Em Breve
        </button>

      </div>

    </section>

  </main>

</div>

<script src="site.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>

</body>
</html>
