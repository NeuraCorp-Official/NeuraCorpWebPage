<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuraCorp — Login</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-card">
  <div class="brand">
    <img src="assets/imgs/nclogo.png" alt="NeuraCorp" class="brand-icon">
    <div class="brand-name">Neura<span>Corp</span></div>
    <div class="brand-tag">Plataforma Corporativa</div>
  </div>
  <h1 class="auth-title">Bem-vindo de volta</h1>
  <p class="auth-subtitle">Acesse sua conta para continuar.</p>
  <div class="alert alert-error" id="alertError">
    <span>⚠</span><span id="alertMsg"></span>
  </div>
  <form id="loginForm" autocomplete="on">
    <div class="form-group">
      <label for="email">Email</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
        <span class="icon">✉</span>
      </div>
    </div>
    <div class="form-group">
      <label for="senha">Senha</label>
      <div class="input-wrap">
        <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">
        <span class="icon">🔒</span>
        <button type="button" class="toggle-pw" onclick="togglePw('senha', this)">👁</button>
      </div>
    </div>
    <a href="recuperarsenha.html" class="forgot-link">Esqueceu sua senha?</a>
    <button type="submit" class="btn-primary" id="btnLogin">Entrar na plataforma</button>
  </form>
  <div class="auth-links">
    Não tem uma conta? <a href="cadastro.html">Criar conta</a>
  </div>
</div>
<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
