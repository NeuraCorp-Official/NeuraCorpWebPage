<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuraCorp — Cadastro</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-card">

  <div class="brand">
    <div class="brand-icon">⬡</div>
    <div class="brand-name">Neura<span>Corp</span></div>
    <div class="brand-tag">Plataforma Corporativa</div>
  </div>

  <h1 class="auth-title">Criar conta</h1>
  <p class="auth-subtitle">Junte-se à NeuraCorp. É rápido e gratuito.</p>

  <div class="alert alert-error" id="alertError">
    <span>⚠</span>
    <span id="alertMsg"></span>
  </div>

  <div class="alert alert-success" id="alertSuccess">
    <span>✓</span>
    <span>Conta criada! Redirecionando...</span>
  </div>

  <form id="cadastroForm" autocomplete="on">

    <div class="form-group">
      <label for="nome">Nome completo</label>
      <div class="input-wrap">
        <input type="text" id="nome" placeholder="Seu nome"
               required autocomplete="name">
        <span class="icon">👤</span>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="seu@email.com"
               required autocomplete="email">
        <span class="icon">✉</span>
      </div>
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <div class="input-wrap">
        <input type="password" id="senha" placeholder="Mínimo 8 caracteres"
               required autocomplete="new-password">
        <span class="icon">🔒</span>
        <button type="button" class="toggle-pw"
                onclick="togglePw('senha', this)">👁</button>
      </div>
      <div class="strength-bar">
        <div class="strength-segment" id="s1"></div>
        <div class="strength-segment" id="s2"></div>
        <div class="strength-segment" id="s3"></div>
        <div class="strength-segment" id="s4"></div>
      </div>
      <div class="strength-text" id="strengthText"></div>
    </div>

    <button type="submit" class="btn-primary" id="btnCadastro">
      Criar minha conta
    </button>

  </form>

  <div class="auth-links">
    Já tem uma conta? <a href="Login.html">Entrar</a>
  </div>

</div>

<script src="auth.js"></script>
</body>
</html>
