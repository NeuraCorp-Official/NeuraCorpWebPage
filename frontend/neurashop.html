      <div class="brand-name">Neura<span>Corp</span></div>
      <div class="brand-tag">Inovação & Tecnologia</div>
    </div>
    <div class="sidebar-search">
      <span class="search-icon">⌕</span>
      <input type="text" placeholder="Pesquisar...">
    </div>
    <div class="nav-label">Navegação</div>
    <nav>
      <ul class="menu">
        <li><a href="index.html"><button class="nav-btn"><span class="nav-icon">⌂</span> Home</button></a></li>
        <li><a href="neurahub.html"><button class="nav-btn"><span class="nav-icon">◈</span> NeuraHub</button></a></li>

    <div class="page-header">

        <div class="empty-title">Produtos em Catalogação</div>
